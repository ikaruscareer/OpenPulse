[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openpulse"
version = "0.1.0"
description = "OpenPulse - OSS change intelligence with evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "click>=8.5.0",
]

[tool.setuptools.packages.find]
include = ["core*", "collectors*", "analyzers*", "cli*", "reports*", "integrations*"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.5"]

[project.scripts]
openpulse = "cli.main:cli"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["SIM115", "SIM102", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
